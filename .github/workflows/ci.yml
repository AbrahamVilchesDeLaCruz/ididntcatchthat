name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ci / detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
            client:
              - 'apps/client/**'
            infra:
              - 'apps/api/Dockerfile'
              - 'apps/client/Dockerfile'
              - 'infra/**'
              - 'Makefile'

  api:
    name: ci / api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      # ── Mirrors docker-compose.test.yml ──────────────────────────────────────
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ididntcatchthat_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: doppler run -- pnpm test:ci
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: E2E tests
        # No Doppler needed — vars come from .env.test (no real secrets)
        run: pnpm test:e2e:ci

      - name: Build
        run: pnpm build

  client:
    name: ci / client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Lint
        run: pnpm lint

      - name: Test
        run: doppler run -- pnpm test:ci
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E tests
        run: pnpm test:e2e:ci
        env:
          CI: true

      - name: Build
        run: pnpm build

  docker:
    name: ci / docker build & scan
    needs: changes
    if: |
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.client == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t ididntcatchthat-api:ci .

      - name: Build client image
        run: docker build -f apps/client/Dockerfile -t ididntcatchthat-client:ci .

      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ididntcatchthat-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan client image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ididntcatchthat-client:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan RabbitMQ image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rabbitmq:4.1-management-alpine
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan Prometheus image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: prom/prometheus:v3.14.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan Grafana image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: grafana/grafana:12.6.0-ubuntu
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # OS layer only — bundled go plugins still carry upstream CVEs we cannot patch
          vuln-type: os

      - name: Scan Loki image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: grafana/loki:3.6.12
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
