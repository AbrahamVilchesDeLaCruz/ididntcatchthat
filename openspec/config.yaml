# OpenSpec Configuration — ididntcatchthat
# Auto-generated by sdd-init. Do not edit manually unless you know what you're doing.
schema: spec-driven

context: |
  ididntcatchthat — Gamified English learning platform (TFM).
  Stack: NestJS (Clean Architecture + TypeORM) backend, React (Vite + TanStack Query + Zustand) frontend.
  Monorepo: pnpm workspaces. Language: TypeScript strict (both apps).
  Architecture: Clean Architecture with Screaming Architecture by feature (API), Pods + Container-Presentational (client).
  Testing: Jest (API unit/E2E), Vitest + RTL (client unit/integration), Playwright (client E2E).
  CI: GitHub Actions (lint → test → build, path-filtered per app).
  Infra: Docker Compose, Doppler for secrets, PostgreSQL (Aiven), Cloudflare CDN, OpenTelemetry + Prometheus + Grafana + Loki.
  Conventions: Conventional Commits, Husky pre-commit hooks, lint-staged.

strict_tdd: true

testing:
  api:
    framework: jest
    unit:
      command: pnpm --filter @ididntcatchthat/api test
      config: jest.config.ts
      pattern: test/**/*.spec.ts
    e2e:
      command: pnpm --filter @ididntcatchthat/api test:e2e
      config: jest.e2e.config.ts
      pattern: test/**/*.e2e-spec.ts
    coverage:
      available: true
      command: pnpm --filter @ididntcatchthat/api test:cov
      provider: v8
      thresholds:
        branches: 90
        functions: 100
        lines: 100
        statements: 100
    tools:
      linter: eslint (9.x, typescript-eslint, prettier plugin)
      formatter: prettier
      type_checker: typescript (strict mode)

  client:
    framework: vitest
    unit:
      command: pnpm --filter @ididntcatchthat/client test
      config: vitest.config.ts
      pattern: src/**/*.{spec,test}.{ts,tsx}
    e2e:
      command: pnpm --filter @ididntcatchthat/client test:e2e
      tool: playwright
    integration:
      available: true
      tool: vitest + @testing-library/react + jsdom + @testing-library/user-event
    coverage:
      available: true
      command: pnpm --filter @ididntcatchthat/client test:cov
      provider: v8 (@vitest/coverage-v8)
      thresholds:
        branches: 80
        functions: 80
        lines: 80
        statements: 80
    tools:
      linter: eslint (10.x, typescript-eslint, prettier plugin)
      formatter: prettier
      type_checker: typescript (strict mode)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    - Never skip tests — run them before and after changes
    tdd: true
    test_command: pnpm --filter @ididntcatchthat/api test:watch
  verify:
    test_command: pnpm test:all
    build_command: pnpm --recursive build
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
    - Always update main specs from delta specs before archiving
