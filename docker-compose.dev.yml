# Dev override — local development
# Variables injected by Doppler (config: dev) via Makefile
services:
  api:
    container_name: ididntcatchthat-api-dev
    image: ididntcatchthat-api:dev
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

  client:
    container_name: ididntcatchthat-client-dev
    image: ididntcatchthat-client:dev
    ports:
      - "4001:80"
    environment:
      NODE_ENV: ${NODE_ENV}

  # ─── Observability ───────────────────────────────────────────────────────────

  prometheus:
    container_name: ididntcatchthat-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data_dev:/prometheus

  grafana:
    container_name: ididntcatchthat-grafana-dev
    ports:
      - "3002:3000"
    volumes:
      - grafana_data_dev:/var/lib/grafana

  loki:
    container_name: ididntcatchthat-loki-dev
    ports:
      - "3100:3100"
    volumes:
      - loki_data_dev:/loki

volumes:
  prometheus_data_dev:
  grafana_data_dev:
  loki_data_dev:
