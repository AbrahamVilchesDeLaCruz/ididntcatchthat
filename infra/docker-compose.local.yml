# Local profile — fully self-contained stack (no Doppler, no paid services)
# Apps:   make local-up (Docker, no hot-reload) | make local-dev (host, hot-reload)
# Onboard: cp apps/api/.env.example apps/api/.env.local && cp apps/client/.env.example apps/client/.env.local
services:
  # ─── Application ─────────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ididntcatchthat-api:local
    container_name: ididntcatchthat-api-local
    env_file: apps/api/.env.local
    environment:
      # Override localhost URLs from .env.local with Docker-internal service names
      DATABASE_URL: postgres://local:local@postgres:5432/ididntcatchthat_local
      AMQP_URI: amqp://local:local@rabbitmq:5672
      CLOUD_STORAGE: http://minio:9000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    image: ididntcatchthat-client:local
    container_name: ididntcatchthat-client-local
    ports:
      - "4001:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # ─── Data & messaging ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: ididntcatchthat-postgres-local
    environment:
      POSTGRES_DB: ididntcatchthat_local
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d ididntcatchthat_local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ididntcatchthat-postgres-local:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: ididntcatchthat-rabbitmq-local
    environment:
      RABBITMQ_DEFAULT_USER: local
      RABBITMQ_DEFAULT_PASS: local
    ports:
      - "5674:5672"
      - "15674:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: ididntcatchthat-minio-local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminio
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ididntcatchthat-minio-local:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ididntcatchthat-minio-init-local
    profiles: [init]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 localminio localminio; do sleep 2; done &&
      mc mb --ignore-existing local/idct-local &&
      mc anonymous set download local/idct-local &&
      echo 'MinIO bucket idct-local ready'
      "

volumes:
  ididntcatchthat-postgres-local:
  ididntcatchthat-minio-local:
