# Prod override — VPS production
# Port bindings use 127.0.0.1 so Docker does not bypass UFW on 0.0.0.0.
# Variables injected by Doppler (config: prd) via Makefile
services:
  api:
    container_name: ididntcatchthat-api-prod
    image: ididntcatchthat-api:prod
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      AMQP_URI: ${AMQP_URI}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ELEVEN_LABS_API_KEY: ${ELEVEN_LABS_API_KEY}
      ELEVENLABS_VOICE_ID_AMERICAN: ${ELEVENLABS_VOICE_ID_AMERICAN}
      ELEVENLABS_VOICE_ID_BRITISH: ${ELEVENLABS_VOICE_ID_BRITISH}
      ELEVENLABS_VOICE_ID_AUSTRALIAN: ${ELEVENLABS_VOICE_ID_AUSTRALIAN}
      CLOUD_STORAGE: ${CLOUD_STORAGE}
      CLOUD_STORAGE_PUBLIC_URL: ${CLOUD_STORAGE_PUBLIC_URL}
      CLOUD_STORAGE_ACCESS_KEY_ID: ${CLOUD_STORAGE_ACCESS_KEY_ID}
      CLOUD_STORAGE_SECRET_ACCESS_KEY: ${CLOUD_STORAGE_SECRET_ACCESS_KEY}
      CLOUD_STORAGE_BUCKET: ${CLOUD_STORAGE_BUCKET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT}
      LOKI_URL: ${LOKI_URL}
      LOG_LEVEL: ${LOG_LEVEL}

  rabbitmq:
    container_name: ididntcatchthat-rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq

  client:
    container_name: ididntcatchthat-client-prod
    image: ididntcatchthat-client:prod
    ports:
      - "127.0.0.1:4000:8080"
    environment:
      NODE_ENV: ${NODE_ENV}

  # ─── Observability — bound to localhost only; access via SSH tunnel ──────────

  prometheus:
    container_name: ididntcatchthat-prometheus-prod
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - prometheus_data_prod:/prometheus

  grafana:
    container_name: ididntcatchthat-grafana-prod
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data_prod:/var/lib/grafana

  loki:
    container_name: ididntcatchthat-loki-prod
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - loki_data_prod:/loki

volumes:
  prometheus_data_prod:
  grafana_data_prod:
  loki_data_prod:
  rabbitmq_data_prod:
