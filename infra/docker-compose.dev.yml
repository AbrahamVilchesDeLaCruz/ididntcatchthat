# Dev override — VPS dev stack + Doppler (config: dev) via Makefile
# Port bindings use 127.0.0.1 so Docker does not bypass UFW on 0.0.0.0.
# RabbitMQ has no host ports here — API container uses rabbitmq:5672 on the Docker network.
# For local hot-reload (`make dev`), add infra/docker-compose.dev-host.yml.
services:
  api:
    container_name: ididntcatchthat-api-dev
    image: ididntcatchthat-api:dev
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      AMQP_URI: ${AMQP_URI}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ELEVEN_LABS_API_KEY: ${ELEVEN_LABS_API_KEY}
      ELEVENLABS_VOICE_ID_AMERICAN: ${ELEVENLABS_VOICE_ID_AMERICAN}
      ELEVENLABS_VOICE_ID_BRITISH: ${ELEVENLABS_VOICE_ID_BRITISH}
      ELEVENLABS_VOICE_ID_AUSTRALIAN: ${ELEVENLABS_VOICE_ID_AUSTRALIAN}
      CLOUD_STORAGE: ${CLOUD_STORAGE}
      CLOUD_STORAGE_PUBLIC_URL: ${CLOUD_STORAGE_PUBLIC_URL}
      CLOUD_STORAGE_ACCESS_KEY_ID: ${CLOUD_STORAGE_ACCESS_KEY_ID}
      CLOUD_STORAGE_SECRET_ACCESS_KEY: ${CLOUD_STORAGE_SECRET_ACCESS_KEY}
      CLOUD_STORAGE_BUCKET: ${CLOUD_STORAGE_BUCKET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4001,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4001}

  client:
    container_name: ididntcatchthat-client-dev
    image: ididntcatchthat-client:dev
    ports:
      - "127.0.0.1:4001:8080"
    environment:
      NODE_ENV: ${NODE_ENV}

  rabbitmq:
    container_name: ididntcatchthat-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Observability — localhost only; access via SSH tunnel (make tunnel-dev) ─

  prometheus:
    container_name: ididntcatchthat-prometheus-dev
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data_dev:/prometheus

  grafana:
    container_name: ididntcatchthat-grafana-dev
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana_data_dev:/var/lib/grafana

  loki:
    container_name: ididntcatchthat-loki-dev
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data_dev:/loki

volumes:
  prometheus_data_dev:
  grafana_data_dev:
  loki_data_dev:
