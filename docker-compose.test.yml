# Test infrastructure — local E2E test environment
# No application services here — only infra (DB, message broker, etc.)
# Usage: make test:e2e:up / make test:e2e:down
services:
  postgres:
    image: postgres:16-alpine
    container_name: ididntcatchthat-postgres-test
    environment:
      POSTGRES_DB: ididntcatchthat_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d ididntcatchthat_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data # ephemeral — no persistence between runs

  rabbitmq:
    image: rabbitmq:4.1-alpine
    container_name: ididntcatchthat-rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    ports:
      - "5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
