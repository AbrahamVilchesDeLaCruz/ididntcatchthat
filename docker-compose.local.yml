# Local profile — self-contained infra (no Doppler, no paid services)
# Usage: make local-up / make local-down
services:
  postgres:
    image: postgres:16-alpine
    container_name: ididntcatchthat-postgres-local
    environment:
      POSTGRES_DB: ididntcatchthat_local
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local -d ididntcatchthat_local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ididntcatchthat-postgres-local:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: ididntcatchthat-rabbitmq-local
    environment:
      RABBITMQ_DEFAULT_USER: local
      RABBITMQ_DEFAULT_PASS: local
    ports:
      - "5674:5672"
      - "15674:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: ididntcatchthat-minio-local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ididntcatchthat-minio-local:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ididntcatchthat-minio-init-local
    profiles: [init]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 localminio localminio; do sleep 2; done &&
      mc mb --ignore-existing local/idct-local &&
      mc anonymous set download local/idct-local &&
      echo 'MinIO bucket idct-local ready'
      "

volumes:
  ididntcatchthat-postgres-local:
  ididntcatchthat-minio-local:
